[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/prospection/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/klubik-ai/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/klubik-ai-hq/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/render.yaml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
